services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aic_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aic_password}
      POSTGRES_DB: ${POSTGRES_DB:-asset_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aic_user} -d ${POSTGRES_DB:-asset_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  neo4j:
    image: neo4j:5-community
    container_name: aic_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-aic_graph_password}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-aic_graph_password} 'RETURN 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: aic_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aic_backend
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aic_password}
      POSTGRES_DB: ${POSTGRES_DB:-asset_intelligence}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-aic_user}:${POSTGRES_PASSWORD:-aic_password}@postgres:5432/${POSTGRES_DB:-asset_intelligence}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aic_graph_password}
      NEO4J_DATABASE: neo4j
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SAMPLE_DATA_PATH: /app/sample-data
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-17}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      THESYS_API_KEY: ${THESYS_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ../flytbase-ahc-swe-asset-intelligence-dataset/sample-data:/app/sample-data:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aic_worker
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aic_password}
      POSTGRES_DB: ${POSTGRES_DB:-asset_intelligence}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-aic_user}:${POSTGRES_PASSWORD:-aic_password}@postgres:5432/${POSTGRES_DB:-asset_intelligence}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-aic_graph_password}
      NEO4J_DATABASE: neo4j
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SAMPLE_DATA_PATH: /app/sample-data
      AS_OF_DATE: ${AS_OF_DATE:-2026-10-17}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      THESYS_API_KEY: ${THESYS_API_KEY:-}
    volumes:
      - ../flytbase-ahc-swe-asset-intelligence-dataset/sample-data:/app/sample-data:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "backend.worker", "worker", "-l", "info"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aic_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
