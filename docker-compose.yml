services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aic_postgres
    restart: always
    environment:
      POSTGRES_USER: aic_user
      POSTGRES_PASSWORD: aic_password
      POSTGRES_DB: asset_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/init.sql

  neo4j:
    image: neo4j:5-community
    container_name: aic_neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/aic_graph_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    container_name: aic_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
